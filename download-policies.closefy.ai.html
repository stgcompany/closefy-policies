<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Download da Política de Privacidade</title>
  <script>
    // Redireciona imediatamente para o arquivo PDF para forçar o download
    window.onload = function() {
      const link = document.createElement('a');
      link.href = "https://storage.closefy.ai/closefy-policies/policies.pdf";
      link.download = "Policies_Closefy.pdf"; // nome sugerido
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
  </script>
</head>
<body>
  <p>Se o download não iniciar automaticamente, <a href="https://storage.closefy.ai/closefy-policies/policies.pdf" download>Clique aqui</a>.</p>
</body>
</html>
